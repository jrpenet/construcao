<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- <link rel="stylesheet" href="./styles/style.css"> -->

    <title>Home</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        :root {
            --tenant-primary: #222;
            --text-color: #2d3332;
            --background-color: #f1f8ff;
            --white: #fff;
            --disabled-color: #999;
            --danger-color: #b00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-weight: 500;
        }

        /* =========================================================
           CONTAINER
        ========================================================= */

        header > div,
        .hero-section,
        .page-content,
        .endereco {
            width: min(1200px, calc(100% - 40px));
            margin-left: auto;
            margin-right: auto;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        header {
            width: 100%;
            padding: 30px 0 20px;
        }

        header > div {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
        }

        /*
         * Logo + nome da empresa
         */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        #logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .business-name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-color);
            max-width: 220px;
        }

        /*
         * Redes sociais / contatos
         */
        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            padding-top: 8px;
        }

        nav > div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav > div a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s ease;
        }

        nav > div a:hover {
            opacity: 0.7;
        }

        nav i {
            color: var(--tenant-primary);
            font-size: 19px;
            line-height: 1;
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero-section {
            min-height: 400px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 500px);
            align-items: center;
            gap: 70px;
            padding: 40px 0 45px;
        }

        .hero-content {
            width: 100%;
            max-width: 600px;
        }

        .hero-content > p {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .hero-content > strong {
            display: block;
            font-size: clamp(36px, 4vw, 50px);
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .hero-content > main {
            max-width: 560px;
            font-size: 16px;
            line-height: 1.7;
        }

        /* =========================================================
           BOTÃO
        ========================================================= */

        #book-btn {
            display: inline-block;
            width: fit-content;
            margin-top: 25px;
            padding: 14px 28px;

            background: var(--tenant-primary);
            color: var(--white);

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: 600;
            text-decoration: none;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #book-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #book-btn.disabled {
            background: var(--disabled-color);
            pointer-events: none;
        }

        #access-note {
            color: var(--danger-color);
            margin-top: 8px;
            font-size: 13px;
        }

        /* =========================================================
           IMAGEM DO TEMPLATE
        ========================================================= */

        .tenant-template-image {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .tenant-template-image img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        /* =========================================================
           CONTEÚDO
        ========================================================= */

        .page-content {
            width: min(1000px, calc(100% - 40px));
        }

        /* =========================================================
           HR
        ========================================================= */

        hr {
            width: min(530px, 100%);
            margin: 0 0 30px;

            border: 0;
            border-top: 1px solid var(--text-color);
        }

        /* =========================================================
           HIGHLIGHTS
        ========================================================= */

        #highlights {
            width: 100%;

            display: flex;
            justify-content: flex-start;
            align-items: stretch;

            gap: 20px;
            flex-wrap: wrap;

            margin-bottom: 20px;
        }

        .highlight-title {
            color: var(--tenant-primary);
            font-size: 17px;
            font-weight: 600;
        }

        .highlight-description {
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================================================
           ENDEREÇO
        ========================================================= */

        .endereco {
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================================================
           BOTÃO PRIMÁRIO
        ========================================================= */

        .primario {
            width: 165px;
            height: 44px;

            background-color: var(--tenant-primary);
            color: var(--background-color);

            border: none;
            border-radius: 5px;

            font-weight: 500;
            text-transform: uppercase;

            cursor: pointer;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 960px) {

            header {
                padding: 20px 0;
            }

            header > div {
                width: min(100% - 40px, 600px);
            }

            nav {
                gap: 15px;
                padding-top: 5px;
            }

            nav > div a {
                font-size: 13px;
            }

            nav i {
                font-size: 17px;
            }

            .hero-section {
                width: min(100% - 40px, 600px);

                display: flex;
                flex-direction: column;

                gap: 30px;

                padding: 25px 0 40px;

                text-align: center;
            }

            .hero-content {
                max-width: 600px;
            }

            .hero-content > p {
                font-size: 15px;
            }

            .hero-content > strong {
                font-size: 40px;
            }

            .hero-content > main {
                margin-left: auto;
                margin-right: auto;

                max-width: 500px;

                font-size: 14px;
            }

            #book-btn {
                margin-left: auto;
                margin-right: auto;
            }

            .tenant-template-image {
                max-width: 500px;
            }

            .page-content {
                width: min(100% - 40px, 600px);
            }

            hr {
                width: min(340px, 100%);
                margin: 0 0 25px;
            }

            #highlights {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .highlight-card {
                width: 100%;
                max-width: 500px;
                padding: 10px 0;
            }

        }

        /* =========================================================
           MOBILE PEQUENO
        ========================================================= */

        @media (max-width: 600px) {

            header > div {
                width: calc(100% - 30px);
                gap: 15px;
            }

            #logo {
                width: 65px;
                height: 65px;
            }

            .business-name {
                font-size: 14px;
                max-width: 180px;
            }

            nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            nav > div {
                gap: 6px;
            }

            nav > div a {
                font-size: 12px;
            }

            nav i {
                font-size: 16px;
            }

            .hero-section {
                width: calc(100% - 30px);
            }

            .hero-content > strong {
                font-size: 34px;
            }

            .page-content {
                width: calc(100% - 30px);
            }

            #highlights {
                width: 100%;
            }

            .highlight-card {
                padding-right: 0;
            }

        }
    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header>
        <div>

            <!-- Logo + Nome da empresa -->
            <div class="brand">

                <a href="/">
                    <img
                        id="logo"
                        data-tenant-field="logo_url"
                        alt="Logo"
                    >
                </a>

                <p
                    class="business-name"
                    data-tenant-field="business_name"
                ></p>

            </div>


            <!-- Contatos -->
            <nav>

                <!-- WhatsApp -->
                <div>
                    <i
                        class="bi bi-telephone-fill"
                        aria-hidden="true"
                    ></i>

                    <a
                        data-tenant-field="whatsapp_phone"
                        target="_blank"
                        rel="noopener noreferrer"
                    ></a>
                </div>


                <!-- Instagram -->
                <div>
                    <i class="bi bi-instagram" aria-hidden="true"></i>
                    <a data-tenant-field="instagram" target="_blank" rel="noopener noreferrer"></a>
                </div>

            </nav>

        </div>
    </header>


    <!-- =========================================================
         HERO
    ========================================================== -->

    <section class="hero-section">

        <div class="hero-content">

            <!-- <p data-tenant-field="business_name"></p> -->

            <strong
                data-tenant-field="phrase_2_title"
            ></strong>

            <main
                data-tenant-field="phrase_1"
            ></main>

            <a
                href="/agendar"
                id="book-btn"
            >
                Agendar horário
            </a>

            <p
                id="access-note"
                hidden
            >
                Agendamentos temporariamente indisponíveis.
            </p>

        </div>


        <!-- Imagem personalizada -->
        <div
            class="tenant-template-image"
            data-tenant-template-image
            style="display:none;"
        >

            <img
                data-tenant-template-image-img
                src=""
                alt=""
            >

        </div>

    </section>


    <!-- =========================================================
         CONTEÚDO INFERIOR
    ========================================================== -->

    <div class="page-content">

        <!-- Linha alinhada à esquerda -->
        <hr>


        <!-- Highlights -->
        <div id="highlights"></div>

    </div>


    <!-- =========================================================
         TEMPLATE DOS HIGHLIGHTS
         Sem imagem
    ========================================================== -->

    <template id="highlight-template">

        <div class="highlight-card">

            <h3 class="highlight-title"></h3>

            <p class="highlight-description"></p>

        </div>

    </template>


    <!-- =========================================================
         ENDEREÇO
    ========================================================== -->

    <p
        class="endereco"
        data-tenant-field="address"
    ></p>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        const API_BASE =
            'https://vaiagenda.com.br/wp-json/agenda/v1';


        /* =====================================================
           SUBDOMÍNIO
        ===================================================== */

        function getSubdomain() {

            return window.location.hostname.split('.')[0];

        }


        /* =====================================================
           TEMA DO TENANT
        ===================================================== */

        function applyTenantTheme(tenant) {

            const primaryColor =
                tenant.primary_color ||
                tenant.theme_color ||
                '#222';


            document.documentElement.style.setProperty(
                '--tenant-primary',
                primaryColor
            );

        }

        /* =====================================================
           CAMPOS DO TENANT
        ===================================================== */

        function bindFields(tenant) {

            document
                .querySelectorAll('[data-tenant-field]')
                .forEach((el) => {

                    const field =
                        el.dataset.tenantField;

                    const value =
                        tenant[field];


                    if (
                        value == null ||
                        value === ''
                    ) {
                        return;
                    }


                    /* Imagens */
                    if (el.tagName === 'IMG') {

                        el.src = value;

                    }


                    /* WhatsApp */
                    else if (
                        field === 'whatsapp_phone' &&
                        el.tagName === 'A'
                    ) {

                        const digits =
                            value.replace(/\D/g, '');

                        el.href =
                            `https://wa.me/${digits}`;

                        el.textContent =
                            value;

                    }


                    /* Instagram */
                    else if (
                        field === 'instagram' &&
                        el.tagName === 'A'
                    ) {

                        const handle =
                            value.replace('@', '');

                        el.href =
                            `https://instagram.com/${handle}`;

                        el.textContent =
                            `@${handle}`;

                    }


                    /* Demais campos */
                    else {

                        el.textContent =
                            value;

                    }

                });


            if (tenant.business_name) {

                document.title =
                    tenant.business_name;

            }

        }


        /* =====================================================
           HIGHLIGHTS
        ===================================================== */

        function renderHighlights(highlights) {

            const container =
                document.getElementById('highlights');

            const template =
                document.getElementById('highlight-template');


            container.innerHTML = '';


            highlights.forEach((h) => {

                const node =
                    template.content.cloneNode(true);


                node.querySelector(
                    '.highlight-title'
                ).textContent =
                    h.title || '';


                node.querySelector(
                    '.highlight-description'
                ).textContent =
                    h.description || '';


                container.appendChild(node);

            });

        }


        /* =====================================================
           IMAGEM DO TEMPLATE
        ===================================================== */

        function renderTenantTemplateImage(tenant) {

            const container =
                document.querySelector(
                    '[data-tenant-template-image]'
                );

            const image =
                document.querySelector(
                    '[data-tenant-template-image-img]'
                );


            if (!container || !image) {
                return;
            }


            if (tenant.template_image_url) {

                image.src =
                    tenant.template_image_url;

                container.style.display =
                    'block';

            }

            else {

                image.src = '';

                container.style.display =
                    'none';

            }

        }


        /* =====================================================
           INICIALIZAÇÃO
        ===================================================== */

        async function init() {

            try {

                const subdomain =
                    getSubdomain();


                const res =
                    await fetch(
                        `${API_BASE}/tenant-config?subdomain=${encodeURIComponent(subdomain)}`
                    );


                const data =
                    await res.json();


                if (!data.success) {

                    document.body.innerHTML =
                        '<p style="text-align:center;padding:40px;">Negócio não encontrado.</p>';

                    return;

                }


                /*
                 * Aplica a cor personalizada.
                 */
                applyTenantTheme(
                    data.tenant
                );


                /*
                 * Preenche os campos.
                 */
                bindFields(
                    data.tenant
                );


                /*
                 * Imagem personalizada.
                 */
                renderTenantTemplateImage(
                    data.tenant
                );


                /*
                 * Controle de acesso.
                 */
                if (!data.access) {

                    document
                        .getElementById('book-btn')
                        .classList
                        .add('disabled');


                    document
                        .getElementById('access-note')
                        .hidden = false;

                }


                /*
                 * Highlights.
                 */
                renderHighlights(
                    data.tenant.home_highlights || []
                );

            }

            catch (error) {

                console.error(
                    'Erro ao carregar tenant:',
                    error
                );


                document.body.innerHTML =
                    '<p style="text-align:center;padding:40px;">Erro ao carregar a página.</p>';

            }

        }

        const observer = new MutationObserver(() => {
  const link = document.querySelector('[data-tenant-field="whatsapp_phone"]');
  
  // Verifica se o elemento existe e se o texto dele ainda começa com 55
  if (link && link.textContent.trim().startsWith('55')) {
    const numeroLimpo = link.textContent.trim().replace(/^55/, '');
    link.textContent = numeroLimpo.replace(/^(\d{2})(\d{1})(\d{4})(\d{4})$/, '($1) $2 $3-$4');
    
    // Para de observar depois que formatou para não pesar a página
    observer.disconnect(); 
  }
});

// Começa a monitorar a página inteira
observer.observe(document.body, { childList: true, subtree: true });




        init();

    </script>

</body>
</html>
